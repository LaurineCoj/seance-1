<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS exo 1</title>
    <style>
        h1 {
            color : #5a5adc;
        }
        p {
            color : rgb(207, 121, 121)
        }
        div {
            color : rgb(134, 192, 134)
        }
        h2 {
            color : pink
        }

        .paragraph {
            background : purple;
        }

        .paragraph:nth-child(1) {
            background : yellow;
            color : black;
        }
      
        .paragraph:nth-child(4) {
            display: none;
        }
    </style>
</head>
<body>
    <h1>Laurine</h1>
    <p>Krystal</p>
    <div>Basma</div>
    <h2>Xuan</h2>
    <div>
    <p class="paragraph">Salut à tous</p>
    
    <p class="paragraph">Salut à tous</p>    
   
    <p class="paragraph">Salut à tous</p>
   
    <p class="paragraph">Salut à tous</p>
   
    </div>
</body>
</html>
